name: Jungle Strike Godot APK → Telegram

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'jungle_strike/godot/**'
      - 'jungle_strike/scripts/package_apk.py'
      - 'jungle_strike/scripts/send_telegram.py'
      - '.github/workflows/jungle-strike-apk-telegram.yml'
  push:
    tags: ['jungle-v*']

permissions:
  contents: read

concurrency:
  group: jungle-godot-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check Telegram secrets are configured
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python3 jungle_strike/scripts/send_telegram.py --check-config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.1.13356709 cmake;3.10.2.4988404'

      - name: Prepare export directory
        run: mkdir -p jungle_strike/godot/build

      - name: Validate project and export Android APK
        id: godot-export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: jungle_strike/godot
          use_preset_export_path: true
          presets_to_export: Android
          cache: true
          verbose: true
        continue-on-error: true

      - name: Report detailed Godot export diagnostics
        if: steps.godot-export.outcome == 'failure'
        shell: bash
        run: |
          set +e
          GODOT="$(find "$HOME/.local/share/godot/godot_executable" -type f -name 'Godot*' -print -quit)"
          if [[ -z "$GODOT" ]]; then echo "::error::Godot executable was not installed"; exit 1; fi
          "$GODOT" --headless --path jungle_strike/godot --editor --quit --verbose 2>&1 | tee /tmp/godot-import.log
          "$GODOT" --headless --path jungle_strike/godot --export-debug Android /tmp/Jungle-Strike-debug.apk --verbose 2>&1 | tee /tmp/godot-export.log
          grep -E 'ERROR:|Parse Error|Error:|error:|Invalid' /tmp/godot-import.log /tmp/godot-export.log | head -n 20 | while IFS= read -r line; do echo "::error title=Godot diagnostic::$line"; done
          exit 1

      - name: Package APK as Telegram ZIP
        if: steps.godot-export.outcome == 'success'
        run: python3 jungle_strike/scripts/package_apk.py --apk jungle_strike/godot/build/Jungle-Strike.apk --output jungle_strike/godot/build/Jungle-Strike-${GITHUB_RUN_NUMBER}.zip --version "$GITHUB_RUN_NUMBER"

      - name: Send APK ZIP to Telegram
        if: steps.godot-export.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python3 jungle_strike/scripts/send_telegram.py --file jungle_strike/godot/build/Jungle-Strike-${GITHUB_RUN_NUMBER}.zip
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_VERSION: ${{ github.ref_name }}

name: Jungle Strike Godot APK → Telegram

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'jungle_strike/godot/**'
      - 'jungle_strike/scripts/package_apk.py'
      - 'jungle_strike/scripts/send_telegram.py'
      - '.github/workflows/jungle-strike-apk-telegram.yml'
  push:
    tags: ['jungle-v*']

permissions:
  contents: read

concurrency:
  group: jungle-godot-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check Telegram secrets are configured
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python3 jungle_strike/scripts/send_telegram.py --check-config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.1.13356709 cmake;3.10.2.4988404'

      - name: Set up Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Prepare Godot Android export templates and debug signing
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_VERSION=$(godot --version | awk 'NR==1 {print $1}')
          GODOT_RELEASE_VERSION='4.4.1-stable'
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          mkdir -p "$TEMPLATE_DIR" "$HOME/.config/godot" "$HOME/.local/share/godot/keystores" jungle_strike/godot/build
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_VERSION}/Godot_v${GODOT_RELEASE_VERSION}_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -oq /tmp/godot-templates.tpz -d /tmp/godot-templates
          test -d /tmp/godot-templates/templates
          cp /tmp/godot-templates/templates/* "$TEMPLATE_DIR/"
          ls -lah "$TEMPLATE_DIR"
          keytool -genkeypair -noprompt -keystore "$HOME/.local/share/godot/keystores/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Godot Debug,O=Jungle Strike,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate Godot project and export Android APK
        id: godot-export
        shell: bash
        run: |
          set +e
          godot --version
          godot --headless --editor --path jungle_strike/godot --quit --verbose 2>&1 | tee /tmp/godot-import.log
          import_status=${PIPESTATUS[0]}
          if [[ $import_status -ne 0 ]]; then
            grep -E 'ERROR:|SCRIPT ERROR|Parse Error|Invalid' /tmp/godot-import.log | head -n 30 | while IFS= read -r line; do echo "::error title=Godot import::$line"; done
            exit "$import_status"
          fi
          godot --headless --path jungle_strike/godot --quit-after 5 --verbose 2>&1 | tee /tmp/godot-runtime.log
          runtime_status=${PIPESTATUS[0]}
          if [[ $runtime_status -ne 0 ]] || grep -qE 'SCRIPT ERROR|Parse Error|Invalid call|Invalid set index|Attempt to call' /tmp/godot-runtime.log; then
            grep -E 'ERROR:|SCRIPT ERROR|Parse Error|Invalid call|Invalid set index|Attempt to call' /tmp/godot-runtime.log | head -n 40 | while IFS= read -r line; do echo "::error title=Godot startup smoke test::$line"; done
            exit 1
          fi
          godot --headless --path jungle_strike/godot --export-debug Android build/Jungle-Strike.apk --verbose 2>&1 | tee /tmp/godot-export.log
          export_status=${PIPESTATUS[0]}
          if [[ $export_status -ne 0 ]]; then
            grep -E 'ERROR:|SCRIPT ERROR|Parse Error|Invalid|not found|not configured|configuration' /tmp/godot-export.log | head -n 40 | while IFS= read -r line; do echo "::error title=Godot Android export::$line"; done
            exit "$export_status"
          fi

      - name: Package APK as Telegram ZIP
        run: python3 jungle_strike/scripts/package_apk.py --apk jungle_strike/godot/build/Jungle-Strike.apk --output jungle_strike/godot/build/Jungle-Strike-${GITHUB_RUN_NUMBER}.zip --version "$GITHUB_RUN_NUMBER"

      - name: Send APK ZIP to Telegram
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python3 jungle_strike/scripts/send_telegram.py --file jungle_strike/godot/build/Jungle-Strike-${GITHUB_RUN_NUMBER}.zip
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_VERSION: ${{ github.ref_name }}

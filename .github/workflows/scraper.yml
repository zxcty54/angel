name: Macro Freight Data Scraper

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas beautifulsoup4 lxml html5lib

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add macro_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update macro freight data via Playwright"
          git push

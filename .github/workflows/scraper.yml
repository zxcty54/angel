name: Macro Freight Data Scraper

on:
  schedule:
    # Runs at 00:00 on day 1 and 15 of the month
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml html5lib

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add macro_data.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update macro freight data"
          git push

# Release transforms (Jetify/R8 over the three Flutter engine ABIs) need real
# headroom; 768m caused 'Java heap space' failures on the CI runner (16 GB).
# On small local machines Gradle will just settle into stable GC at this cap.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true

kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m
org.gradle.vfs.watch=false
